<!DOCTYPE html>
<html>
<head>
    <title>Groq AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .chatbox {
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            margin-left: 5px;
            background: #000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #response {
            margin-top: 20px;
            text-align: left;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 30px;
        }
    </style>
</head>

<body>

<div class="chatbox">
    <h1>🤖 Groq AI Chatbot</h1>

    <input
        type="text"
        id="message"
        placeholder="Type your message..."
    >

    <button onclick="sendMessage()">Send</button>

    <div id="response">
        Response will appear here...
    </div>
</div>

<script>
async function sendMessage() {

    const message = document.getElementById("message").value;
    const responseBox = document.getElementById("response");

    if (!message) {
        responseBox.innerText = "Please enter a message.";
        return;
    }

    responseBox.innerText = "Thinking...";

    try {

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (data.reply) {
            responseBox.innerText = data.reply;
        } else {
            responseBox.innerText = data.error || "Something went wrong.";
        }

    } catch (error) {

        responseBox.innerText = "Error connecting to chatbot.";

        console.error(error);
    }
}
</script>

</body>
</html>
